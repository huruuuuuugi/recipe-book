<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2350c8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="レシピ帳">
  <title>レシピ帳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="rb-header rb-header--title">
      <h1 class="rb-screen-title">レシピ帳</h1>
      <span class="rb-header__count" id="count"></span>
    </header>

    <nav class="rb-chips" aria-label="カテゴリで絞り込み" id="filters">
      <button type="button" class="rb-chip" data-category="all" aria-pressed="true">すべて</button>
      <button type="button" class="rb-chip" data-category="main" aria-pressed="false">主菜</button>
      <button type="button" class="rb-chip" data-category="side" aria-pressed="false">副菜</button>
      <button type="button" class="rb-chip" data-category="soup" aria-pressed="false">汁物</button>
      <button type="button" class="rb-chip" data-category="staple" aria-pressed="false">ご飯・麺</button>
    </nav>

    <main>
      <ul class="rb-cards" id="list"></ul>

      <div class="rb-empty" id="empty" hidden>
        <div class="rb-empty__tile rb-tile" aria-hidden="true"></div>
        <p class="rb-empty__title" id="empty-title">最初のレシピを追加しましょう</p>
        <p class="rb-empty__note" id="empty-note">レシピはこのスマホの中に保存されます</p>
      </div>

      <section class="rb-backup" aria-labelledby="backup-title">
        <h2 class="rb-section-title" id="backup-title">バックアップ</h2>
        <p class="rb-field__hint">全レシピをファイルに書き出して、別の端末で読み込めます</p>
        <div class="rb-backup__actions">
          <button type="button" class="rb-btn rb-btn--outline" id="export">書き出す</button>
          <input class="visually-hidden" id="import" type="file" accept="application/json,.json">
          <label class="rb-btn rb-btn--outline" for="import">読み込む</label>
        </div>
        <p class="rb-backup__status" id="backup-status" role="status"></p>
      </section>
    </main>

    <a class="rb-fab rb-fab--fixed" href="form.html">＋追加</a>
  </div>

  <template id="card-template">
    <li>
      <a class="rb-card">
        <div class="rb-card__img rb-tile" aria-hidden="true"></div>
        <div class="rb-card__body">
          <h2 class="rb-card__title"></h2>
          <div class="rb-card__meta">
            <span class="rb-label rb-label--line" data-field="category"></span>
            <span data-field="time"></span>
          </div>
        </div>
      </a>
    </li>
  </template>

  <script src="js/storage.js"></script>
  <script src="js/list.js"></script>
</body>
</html>
